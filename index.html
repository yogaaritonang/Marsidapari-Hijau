    <script>
      (function () {
        // Intercept Vite HMR WebSocket in AI Studio preview where HMR is disabled
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))
            ) {
              var target = new EventTarget();
              var mockWs = {
                readyState: 1, // OPEN
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: url,
                send: function () {},
                close: function () {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(function () {
                var openEvt = new Event('open');
                target.dispatchEvent(openEvt);
                if (typeof mockWs.onopen === 'function') {
                  mockWs.onopen(openEvt);
                }
              }, 0);
              return mockWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress any remaining WebSocket error logs per environment constraints
        var origError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
              if (
                str.indexOf('WebSocket') !== -1 ||
                str.indexOf('ws:') !== -1 ||
                str.indexOf('wss:') !== -1 ||
                str.indexOf('closed without opened') !== -1
              ) {
                return;
              }
            }
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>

    <script>
      // Gracefully handle Vite HMR WebSocket errors in AI Studio iframe preview
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
